databases:
  - name: conectados-db
    plan: free
    databaseName: conectados

services:
  - type: web
    name: conectados
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: bash build.sh
    startCommand: gunicorn conectados.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "conectados-zd6g.onrender.com"
      - key: SITE_URL
        value: "https://conectados-zd6g.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: conectados-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13"
